services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: wr3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wr3
      POSTGRES_USER: wr3
      POSTGRES_PASSWORD: wr3
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wr3 -d wr3"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wr3-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Foundry/Anvil — local EVM fork for PoC sandbox
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: wr3-anvil
    restart: unless-stopped
    ports:
      - "8545:8545"
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545"]
    profiles:
      - sandbox

