name: CD · web → Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - ".github/workflows/cd-web.yml"

# Cancel in-flight deploys when a newer commit lands on main
concurrency:
  group: cd-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate: wait for CI to pass on the same commit ──────────────
  ci:
    uses: ./.github/workflows/ci-web.yml

  # ── Deploy to Cloudflare Workers ──────────────────────────────
  deploy:
    needs: [ci]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build for Cloudflare
        working-directory: apps/web
        run: bun run cf:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          WR3_API_URL: ${{ secrets.WR3_API_URL }}

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        run: bun run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
