name: CI · web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - ".github/workflows/ci-web.yml"
      - "package.json"
      - "turbo.json"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - ".github/workflows/ci-web.yml"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck --filter @wr3/web

      - name: Lint
        run: bun run lint --filter @wr3/web

      - name: Build
        run: bun run build --filter @wr3/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
