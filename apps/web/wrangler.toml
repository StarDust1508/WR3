# Cloudflare Workers config for the wr3 Mini App.
#
# Built by `@opennextjs/cloudflare` (see open-next.config.ts and the
# `cf:build` script in package.json). The adapter produces:
#   .open-next/worker.js   — the Worker entry that serves Next.js
#   .open-next/assets/     — static files (Next.js public/, hashed JS, CSS)
#
# At runtime the Worker reads ASSETS to serve static files and falls back
# to its own handler for SSR + API routes.

name = "wr3"
main = ".open-next/worker.js"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Runtime env vars. WR3_API_URL is also overridable from the dashboard,
# BUT: `wrangler deploy` replaces dashboard vars with this section by
# default. So we ship the current tunnel URL here as the canonical
# source — operator can change either place and the dashboard wins after
# a no-op redeploy, since dashboard edits don't bump the deploy version.
# In practice: edit here, deploy = pushes URL; edit dashboard = effective
# for the live worker but reset on next deploy.
#
# Rotate this whenever the serveo tunnel restarts and gets a new URL.
[vars]
WR3_DEPLOYED_AT = "ci"
WR3_API_URL = "https://7ecc5077d2bb7bdf-72-56-67-82.serveousercontent.com"
